<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>finder by jonas</title>
    <style>
        body { 
            font-family: 'segoe ui', tahoma, geneva, verdana, sans-serif; 
            background: linear-gradient(135deg, #1f4037 0%, #99f2c8 100%); 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            text-align: center; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .box { 
            background: rgba(0, 0, 0, 0.85); 
            padding: 2.5rem; 
            border-radius: 20px; 
            backdrop-filter: blur(15px); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            max-width: 580px; 
            width: 100%; 
            position: relative; 
        }
        h2 { 
            margin-top: 0; 
            color: #99f2c8; 
        }
        .input-container { 
            position: relative; 
            margin: 10px 0; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 8px; 
            font-size: 1rem; 
            box-sizing: border-box; 
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            text-align: center; 
            transition: all 0.3s ease;
        }
        input:focus { 
            outline: none; 
            border-color: #99f2c8; 
            background: rgba(255, 255, 255, 0.15);
        }
        .autocomplete-box { 
            position: absolute; 
            top: 100%; 
            left: 0; 
            right: 0; 
            background: #111; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-top: none; 
            border-radius: 0 0 8px 8px; 
            max-height: 280px; 
            overflow-y: auto; 
            z-index: 99; 
            display: none; 
            text-align: left; 
        }
        .autocomplete-item { 
            padding: 10px 15px; 
            cursor: pointer; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            transition: background 0.2s ease;
        }
        .autocomplete-item:hover { 
            background: #99f2c8; 
            color: #1f4037; 
            font-weight: bold; 
        }
        .autocomplete-item img { 
            width: 32px; 
            height: 45px; 
            object-fit: cover; 
            border-radius: 3px; 
            background: #222; 
        }
        .autocomplete-item .info {
            display: flex;
            flex-direction: column;
        }
        .autocomplete-item .author {
            font-size: 0.8rem;
            opacity: 0.7;
        }
        button { 
            background: linear-gradient(45deg, #1f4037, #5b86e5); 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 1rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); 
            margin-top: 15px; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover { 
            background: linear-gradient(45deg, #2a554a, #6c95f5); 
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        /* Stil für das Buch-Ergebnis */
        .result-card {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            text-align: left;
        }
        .result-card h3 { margin: 0 0 5px 0; color: #99f2c8; }
        .result-card h4 { margin: 0 0 10px 0; font-weight: normal; opacity: 0.8; font-size: 0.9rem; }
        .result-card p { font-size: 0.9rem; line-height: 1.4; margin: 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>

    <div class="box">
        <h2>finder by jonas</h2>
        <div class="input-container">
            <input type="text" id="search-input" placeholder="Buch oder Autor eingeben..." autocomplete="off">
            <div class="autocomplete-box" id="autocomplete-box"></div>
        </div>
        <button id="search-button">Buch suchen</button>

        <!-- Hier werden die echten Infos nach der Auswahl angezeigt -->
        <div class="result-card" id="result-card">
            <h3 id="res-title">Buchtitel</h3>
            <h4 id="res-author">Autor</h4>
            <p id="res-desc">Beschreibung des Buches...</p>
        </div>
    </div>

    <script>
        const input = document.getElementById('search-input');
        const box = document.getElementById('autocomplete-box');
        const button = document.getElementById('search-button');
        
        const resultCard = document.getElementById('result-card');
        const resTitle = document.getElementById('res-title');
        const resAuthor = document.getElementById('res-author');
        const resDesc = document.getElementById('res-desc');

        let timeoutId;

        // Funktion, um Daten live von Google Books abzufragen
        async function fetchBooks(query) {
            if (!query) return;
            try {
                // Sucht nach Titeln in deutscher Sprache, max. 6 Ergebnisse
                const response = await fetch(`https://googleapis.com{encodeURIComponent(query)}&langRestrict=de&maxResults=6`);
                const data = await response.json();
                return data.items || [];
            } catch (error) {
                console.error("Fehler beim Laden der Buchdaten:", error);
                return [];
            }
        }

        // Live-Suche während der Eingabe (mit 300ms Verzögerung zur Performance-Schonung)
        input.addEventListener('input', () => {
            clearTimeout(timeoutId);
            const val = input.value.trim();

            if (!val) {
                box.innerHTML = '';
                box.style.display = 'none';
                return;
            }

            timeoutId = setTimeout(async () => {
                const books = await fetchBooks(val);
                box.innerHTML = '';

                if (books.length > 0) {
                    books.forEach(book => {
                        const info = book.volumeInfo;
                        const title = info.title || "Unbekannter Titel";
                        const authors = info.authors ? info.authors.join(', ') : "Unbekannter Autor";
                        // Nutzt das echte Vorschaubild oder ein Fallback, falls keins existiert
                        const img = info.imageLinks ? info.imageLinks.smallThumbnail : "https://placeholder.com";

                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.innerHTML = `
                            <img src="${img}" alt="Cover"> 
                            <div class="info">
                                <span class="title">${title}</span>
                                <span class="author">${authors}</span>
                            </div>
                        `;
                        
                        // Wenn ein Buch angeklickt wird
                        div.addEventListener('click', () => {
                            input.value = title;
                            box.style.display = 'none';
                            showBookDetails(info);
                        });
                        
                        box.appendChild(div);
                    });
                    box.style.display = 'block';
                } else {
                    box.style.display = 'none';
                }
            }, 300);
        });

        // Details im Info-Kasten anzeigen
        function showBookDetails(info) {
            resTitle.innerText = info.title;
            resAuthor.innerText = info.authors ? "Von: " + info.authors.join(', ') : "Autor unbekannt";
            resDesc.innerText = info.description || "Keine Beschreibung für dieses Buch verfügbar.";
            resultCard.style.display = 'block';
        }

        // Schließe die Autocomplete-Box bei einem Klick außerhalb
        document.addEventListener('click', (e) => {
            if (e.target !== input && e.target !== box) {
                box.style.display = 'none';
            }
        });

        // Button-Klick sucht nach dem aktuellen Begriff im Feld
        button.addEventListener('click', async () => {
            const val = input.value.trim();
            if (val) {
                const books = await fetchBooks(val);
                if(books.length > 0) {
                    showBookDetails(books[0].volumeInfo);
                }
            }
        });
    </script>

</body>
</html>
